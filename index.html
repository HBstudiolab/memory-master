<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<meta content="#2563eb" name="theme-color"/>
<meta content="PC와 휴대폰에서 사용하는 개인 암기 웹앱" name="description"/>
<title>암기 마스터</title>
<link href="style.css" rel="stylesheet"/>
</head>
<body>
<div class="shell">
<header class="topbar">
<div><p class="eyebrow">MEMORY MASTER</p><h1>암기 마스터</h1></div>

<section aria-label="학습 현황" class="header-stats">
<div><span>남은 문제</span><strong id="remaining">–</strong></div>
<div><span>완료</span><strong id="completed">–</strong></div>
<div><span>첫 시도 정답률</span><strong id="accuracy">–</strong></div>
<div><span>학습 시간</span><strong id="timer">00:00</strong></div>
</section></header>
<main class="workspace">
<section class="panel question-panel">
<div class="panel-heading"><div><span class="smalllabel">문제</span><h2 id="question-title">문제를 불러오는 중…</h2></div><span class="chip" id="round-chip">이미지 문제</span></div>
<div class="image-well" id="question-well"><img alt="문제 이미지" id="question-image"/><div class="hit-layer" id="hit-layer" aria-hidden="true"></div><button class="zoom-button" hidden id="zoom-question" type="button" aria-label="문제 이미지 확대">🔍 확대</button><p hidden="" id="question-empty">이미지를 표시할 수 없습니다.</p></div>
<p class="hint" id="question-hint">이미지에서 정답 위치를 누르세요.</p>
<div class="action-row" id="actions"><button class="outline" id="reveal" type="button">정답·해설 보기</button><button class="ghost" id="skip" type="button">나중에 풀기</button></div>
<div class="result" hidden id="result">
<div class="feedback" id="feedback" role="status"></div>
<p class="correct-answer" id="correct-answer"></p>
<button class="primary next" hidden id="next-top" type="button">다음 문제 →</button>
<div class="explanation-well" hidden id="explanation-well"><span class="smalllabel">해설</span><img alt="해설 이미지" id="explanation-image"/></div>
<button class="primary next" hidden id="next" type="button">다음 문제 →</button>
</div>
<div class="finish" hidden="" id="finish"><div class="finish-emoji">🎉</div><h2>이번 학습을 완료했습니다!</h2><p id="finish-summary"></p><button class="primary" id="finish-restart" type="button">다시 학습하기</button></div>
</section>
</main>
<section aria-label="학습 설정과 현황" class="bottom-tools">
<div class="bottom-tools-heading"><h2>학습 설정 · 현황</h2><button class="ghost" id="restart" type="button">처음부터</button></div>
<section aria-label="문제 세트 설정" class="setup">
<div class="setup-text"><label for="dataset">문제 세트</label><select id="dataset"><option value="default">기본 예시 문제</option></select></div>
<div class="setup-text"><label for="range">이번 학습 문제 수</label><select id="range"><option value="all">전체</option><option value="10">10문제</option><option value="20">20문제</option><option value="50">50문제</option><option value="100">100문제</option></select></div>
<button class="outline" id="apply" type="button">새 학습 시작</button>
</section>

<div aria-label="학습 진행률" class="progress-track"><div class="progress-bar" id="progress"></div></div>
</section>
<footer>학습 기록은 현재 브라우저에 저장됩니다. 다른 기기와 자동으로 동기화되지 않습니다.</footer>
</div>
<dialog aria-label="이미지 확대" id="lightbox"><button class="lightbox-close" id="close-lightbox" type="button">닫기 ✕</button><img alt="확대 이미지" id="lightbox-image"/></dialog>
<button class="next-float" id="next-float" type="button" aria-label="다음 문제" title="다음 문제" hidden><span class="next-float-arrow" aria-hidden="true"></span><span class="next-float-label">다음</span></button>
<button class="archery-launch" id="archery-launch" type="button" aria-label="활쏘기 조준" title="누른 채 드래그해서 조준하고, 손을 떼면 발사합니다" disabled>
<span class="bow-icon" aria-hidden="true"></span>
</button>
<script defer="" src="archery.js"></script>
<script defer="" src="fx.js"></script>
<script defer="" src="app.js"></script>
</body>
</html>
